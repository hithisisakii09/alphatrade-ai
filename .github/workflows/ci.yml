name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite & Zero-Trust Verification
    runs-on: ubuntu-latest
    env:
      ALPHATRADE_EXECUTION_MODE: PAPER
      ALPHATRADE_DATABASE_URL: sqlite:///./test_alphatrade.db
      ALPHATRADE_DATA_PROVIDER: LOCAL_CSV

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unified Test Runner
        run: python run_tests.py

      - name: Run Pytest Suite
        run: pytest -v

  docker:
    name: Production Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: alphatrade-ai:latest
