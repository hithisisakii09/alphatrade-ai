version: "3.8"

services:
  alphatrade-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alphatrade-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ALPHATRADE_EXECUTION_MODE=PAPER
      - ALPHATRADE_DATABASE_URL=sqlite:////app/data/alphatrade_v2.db
      - TZ=Asia/Kolkata
    volumes:
      - ./data:/app/data
      - ./.cache:/app/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

